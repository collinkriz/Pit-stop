<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pit Stop">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<title>Pit Stop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #ffffff; --sheet: #ffffff; --field: #f1f3f4; --line: #eceef0; --line-2: #dadce0;
    --text: #1f1f1f; --muted: #5f6368; --faint: #9aa0a6;
    --blue: #1a73e8; --blue-soft: #e8f0fe; --route: #1a73e8; --route-casing: #0b4fb5;
    --good: #188038; --good-bg: #e6f4ea; --good-pin: #1e8e3e;
    --ok: #b06000;   --ok-bg: #fef3e0;   --ok-pin: #e37400;
    --bad: #c5221f;  --bad-bg: #fce8e6;  --bad-pin: #d93025;
    --shadow: 0 2px 6px rgba(60,64,67,.15), 0 1px 2px rgba(60,64,67,.25);
    --shadow-lg: 0 -2px 16px rgba(60,64,67,.16);
    --sheet-vis: 50vh;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --sheet: #1c1c1e; --field: #2c2c2e; --line: #2c2c2e; --line-2: #3a3a3c;
      --text: #f2f2f7; --muted: #aeaeb2; --faint: #8e8e93;
      --blue: #4c8dff; --blue-soft: #1f2f4d; --route: #4c8dff; --route-casing: #1d4fa8;
      --good: #81c995; --good-bg: #1f3326; --good-pin: #2e9a4f;
      --ok: #fdc36b;   --ok-bg: #3b2e17;   --ok-pin: #e8890c;
      --bad: #f28b82;  --bad-bg: #3c1f1e;  --bad-pin: #e0473c;
      --shadow: 0 2px 8px rgba(0,0,0,.5); --shadow-lg: 0 -2px 18px rgba(0,0,0,.55);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); }
  button, input, select { font-family: inherit; }
  svg { display: block; }

  /* ---------- Map ---------- */
  #map { position: fixed; inset: 0; z-index: 0; background: var(--field); }
  .leaflet-container { font-family: var(--font); }
  .leaflet-bottom { bottom: var(--sheet-vis); transition: bottom .28s ease; }
  .leaflet-control-attribution { font-size: 10px; background: rgba(255,255,255,.7) !important; }
  @media (prefers-color-scheme: dark) { .leaflet-control-attribution { background: rgba(0,0,0,.55) !important; color: #aaa; } .leaflet-control-attribution a { color: #ccc; } }

  /* ---------- Route card ---------- */
  .topcard {
    position: fixed; z-index: 1100; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 8px);
    max-width: 560px; margin: 0 auto; background: var(--sheet); border-radius: 14px; box-shadow: var(--shadow);
    padding: 4px 4px 10px 14px;
  }
  .route-row { display: flex; align-items: stretch; gap: 10px; }
  .findbtn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: calc(100% - 10px); margin: 6px 0 0;
    border: 0; border-radius: 10px; background: var(--blue); color: #fff; font-size: 16px; font-weight: 600; height: 44px; cursor: pointer;
  }
  .findbtn:active { opacity: .85; }
  .findbtn:disabled { opacity: .6; }
  .rail { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px 0; }
  .rail .s { width: 10px; height: 10px; border-radius: 50%; border: 2.5px solid var(--blue); flex: none; }
  .rail .l { flex: 1; border-left: 2px dotted var(--line-2); margin: 4px 0; min-height: 12px; }
  .rail .e { width: 11px; height: 11px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--bad-pin); flex: none; }
  .inputs { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .in-row { display: flex; align-items: center; }
  .in-row input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); font-size: 16px; padding: 11px 0; }
  input::placeholder { color: var(--faint); }
  .inputs .div { height: 1px; background: var(--line); }
  .ibtn { width: 40px; height: 40px; border: 0; background: none; color: var(--muted); border-radius: 50%; display: grid; place-items: center; cursor: pointer; flex: none; }
  .ibtn:active { background: var(--field); }
  .ibtn.on { color: var(--blue); }
  .swap { align-self: center; }

  .fab {
    position: fixed; z-index: 1050; right: 12px; bottom: calc(var(--sheet-vis) + 12px);
    width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--sheet); color: var(--blue);
    box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer; transition: bottom .28s ease, opacity .2s;
  }
  .fab[hidden] { display: none; }
  .fab.away { opacity: 0; pointer-events: none; }

  /* ---------- Sheet ---------- */
  .sheet {
    position: fixed; z-index: 1100; left: 0; right: 0; bottom: 0; height: 50vh; max-width: 640px; margin: 0 auto;
    background: var(--sheet); border-radius: 16px 16px 0 0; box-shadow: var(--shadow-lg);
    display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom);
    transition: height .28s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.dragging { transition: none; }
  .sheet-top { touch-action: none; flex: none; padding: 0 16px 12px; }
  .grab { padding: 8px 0 10px; display: grid; place-items: center; cursor: grab; }
  .grab i { width: 36px; height: 5px; border-radius: 3px; background: var(--line-2); display: block; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--field); border-radius: 12px; padding: 0 4px 0 12px; color: var(--muted); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); font-size: 16px; padding: 11px 0; }
  .search .ibtn { width: 34px; height: 34px; }
  .search .ibtn[hidden] { display: none; }
  .search .goq { background: var(--blue); color: #fff; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--field); border-radius: 10px; padding: 2px; margin-top: 10px; }
  .seg button { border: 0; background: none; color: var(--text); font-size: 13.5px; font-weight: 500; padding: 7px 2px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .seg button.on { background: var(--sheet); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.14); }
  @media (prefers-color-scheme: dark) { .seg button.on { background: #48484a; } }

  .sheet-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

  /* ---------- Intro ---------- */
  .intro { padding: 18px 20px 28px; }
  .intro h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.2px; }
  .intro p { color: var(--muted); font-size: 15px; line-height: 1.45; margin: 6px 0 0; }
  .linkbtn { border: 0; background: none; color: var(--blue); font-size: 15px; font-weight: 600; padding: 0; margin-top: 14px; cursor: pointer; }

  /* ---------- Results header ---------- */
  .results-head { position: sticky; top: 0; z-index: 2; background: var(--sheet); }
  .summary { padding: 10px 16px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .sum-text { min-width: 0; }
  .sum-main { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sum-side { color: var(--muted); font-size: 13.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .demo-tag { font-size: 11px; font-weight: 700; letter-spacing: .4px; color: var(--ok); background: var(--ok-bg); padding: 2px 6px; border-radius: 5px; margin-right: 6px; vertical-align: 2px; }
  .results-head { border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .sort { position: relative; flex: none; color: var(--blue); font-size: 14px; font-weight: 600; }
  .sort select { position: absolute; inset: 0; opacity: 0; font-size: 16px; }
  .sort span::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 6px; border-right: 1.8px solid currentColor; border-bottom: 1.8px solid currentColor; transform: translateY(-3px) rotate(45deg); }
  .more-far { display: block; margin: 14px auto 0; }

  /* ---------- Rows ---------- */
  .list { list-style: none; margin: 0; padding: 0 0 24px; }
  .row { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .row.sel { background: var(--blue-soft); }
  .row.sel .breakdown { background: var(--sheet); }
  .row-main { display: grid; grid-template-columns: 56px 1fr 44px; gap: 12px; align-items: center; }
  .figs { display: grid; gap: 4px; justify-items: stretch; }
  .detour { border-radius: 10px; text-align: center; padding: 6px 0 5px; line-height: 1; }
  .detour b { display: block; font-size: 19px; font-weight: 700; letter-spacing: -.3px; }
  .detour span { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
  .stopfig { display: flex; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .t-good { color: var(--good); background: var(--good-bg); }
  .t-ok { color: var(--ok); background: var(--ok-bg); }
  .t-bad { color: var(--bad); background: var(--bad-bg); }
  .row-text { min-width: 0; }
  .name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: 13.5px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .warn { color: var(--ok); }
  .meta .closed { color: var(--bad); font-weight: 600; }
  .style-tag { font-weight: 600; color: var(--text); }
  .navbtn { width: 44px; height: 44px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; text-decoration: none; }
  .row-more { display: none; margin: 12px 0 2px 68px; }
  .row.sel .row-more { display: block; }
  .breakdown { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: var(--sheet); border-radius: 12px; padding: 10px 12px; }
  .breakdown div { font-size: 12px; color: var(--muted); }
  .breakdown b { display: block; font-size: 16px; color: var(--text); font-weight: 700; margin-top: 1px; }
  .addr { font-size: 13px; color: var(--muted); line-height: 1.35; margin-top: 10px; }
  .more-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; text-decoration: none; cursor: pointer; border: 1px solid var(--line-2); background: var(--sheet); color: var(--blue); font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 999px; }
  .pill.solid { background: var(--blue); color: #fff; border-color: var(--blue); }

  .state { padding: 30px 20px; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .state strong { color: var(--text); display: block; font-size: 16px; margin-bottom: 2px; }
  .state .pill { margin-top: 12px; }
  .err { margin: 16px; padding: 14px; border-radius: 12px; background: var(--bad-bg); color: var(--bad); font-size: 14px; line-height: 1.45; }
  .err strong { display: block; margin-bottom: 2px; }
  .err .pill { margin-top: 10px; }
  .foot { color: var(--faint); font-size: 12px; text-align: center; padding: 14px 24px 0; line-height: 1.4; }

  .loadbar { height: 3px; overflow: hidden; position: relative; background: var(--blue-soft); }
  .loadbar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; background: var(--blue); animation: lb 1.1s ease-in-out infinite; }
  @keyframes lb { from { left: -40%; } to { left: 100%; } }
  .skel { padding: 14px 16px; display: grid; grid-template-columns: 56px 1fr; gap: 12px; border-bottom: 1px solid var(--line); }
  .skel div { border-radius: 8px; background: var(--field); }
  .skel .a { height: 44px; } .skel .b { height: 14px; margin-top: 4px; width: 55%; } .skel .c { height: 12px; margin-top: 8px; width: 80%; }

  /* ---------- Map pins ---------- */
  .pin-wrap { background: none; border: 0; }
  .pin {
    position: absolute; transform: translate(-50%, calc(-100% - 6px)); white-space: nowrap;
    color: #fff; font: 700 13px var(--font); padding: 4px 8px; border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.35); border: 1.5px solid #fff; transition: transform .15s;
  }
  .pin::after { content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); border: 6px solid transparent; border-bottom: 0; }
  .pin.p-good { background: var(--good-pin); } .pin.p-good::after { border-top-color: var(--good-pin); }
  .pin.p-ok { background: var(--ok-pin); }     .pin.p-ok::after { border-top-color: var(--ok-pin); }
  .pin.p-bad { background: var(--bad-pin); }   .pin.p-bad::after { border-top-color: var(--bad-pin); }
  .pin.sel { transform: translate(-50%, calc(-100% - 6px)) scale(1.25); z-index: 10; }
  .end-pin { position: absolute; width: 24px; height: 24px; transform: translate(-50%, -100%); }
  .me-dot { position: absolute; width: 18px; height: 18px; transform: translate(-50%, -50%); border-radius: 50%; background: var(--blue); border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(26,115,232,.2), 0 1px 3px rgba(0,0,0,.3); }
  .start-dot { position: absolute; width: 16px; height: 16px; transform: translate(-50%, -50%); border-radius: 50%; background: #fff; border: 4px solid var(--route); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
</style>
</head>
<body>

<div id="map"></div>

<div class="topcard" id="topcard">
 <div class="route-row">
  <div class="rail" aria-hidden="true"><span class="s"></span><span class="l"></span><span class="e"></span></div>
  <div class="inputs">
    <div class="in-row">
      <input id="from" placeholder="Starting point" enterkeyhint="next" autocomplete="off">
      <button type="button" class="ibtn" id="locate" aria-label="Start from my location">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M21 3 3 10.5l7.2 2.3L12.5 20z"/></svg>
      </button>
    </div>
    <div class="div"></div>
    <div class="in-row"><input id="to" placeholder="Where to?" enterkeyhint="search" autocomplete="off"></div>
  </div>
  <button type="button" class="ibtn swap" id="swap" aria-label="Swap start and destination">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 4v16M8 4 4.5 7.5M8 4l3.5 3.5M16 20V4M16 20l-3.5-3.5M16 20l3.5-3.5"/></svg>
  </button>
 </div>
 <button type="button" class="findbtn" id="find">
   <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
   <span id="findLabel">Find food stops</span>
 </button>
</div>

<button class="fab" id="fit" hidden aria-label="Show whole route">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>

<section class="sheet" id="sheet">
  <div class="sheet-top" id="sheetTop">
    <div class="grab" id="grab"><i></i></div>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="query" placeholder="Any restaurant, or e.g. Taco Bell" enterkeyhint="search" autocomplete="off">
      <button type="button" class="ibtn" id="clearQ" aria-label="Clear" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.3 12.9-1.4 1.4L12 13.4l-2.9 2.9-1.4-1.4 2.9-2.9-2.9-2.9 1.4-1.4 2.9 2.9 2.9-2.9 1.4 1.4-2.9 2.9z"/></svg>
      </button>
    </div>
    <div class="seg" id="seg" role="tablist"></div>
  </div>
  <div class="sheet-body" id="body"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const fromEl = $("from"), toEl = $("to"), queryEl = $("query"), bodyEl = $("body");
  const sheet = $("sheet"), sheetTop = $("sheetTop"), topcard = $("topcard");

  // ---------- Service style + typical time at the stop ----------
  const STYLES = {
    drive: { label: "Drive-thru", short: "Drive-thru", mins: 5 },
    quick: { label: "Counter", short: "Counter", mins: 15 },
    sit:   { label: "Sit-down", short: "Sit-down", mins: 45 },
  };
  const norm = (s) => String(s || "").toLowerCase().replace(/[’'`.]/g, "").replace(/&/g, "and");
  const DRIVE_CHAINS = ["mcdonalds","taco bell","wendys","burger king","chick-fil-a","chick fil a","culvers","arbys","sonic","dunkin","starbucks","tim hortons","popeyes","kfc","jack in the box","in-n-out","in n out","whataburger","del taco","checkers","rallys","hardees","carls jr","white castle","zaxbys","raising canes","dairy queen","taco johns","krispy kreme","biggby","dutch bros","bojangles","churchs","long john silver","steak n shake","freddys","aandw","a and w","wienerschnitzel","portillos","panda express","jimmy johns","del taco","captain ds","krystal","biscuitville","tropical smoothie"];
  const QUICK_CHAINS = ["subway","chipotle","panera","qdoba","five guys","jersey mikes","firehouse subs","potbelly","noodles and company","shake shack","moes","wingstop","little caesars","dominos","papa johns","cava","sweetgreen","mod pizza","blaze pizza","qdoba","jets pizza","penn station","au bon pain","einstein","bruegger"];
  const QUICK_TYPES = ["fast_food_restaurant","cafe","coffee_shop","sandwich_shop","bakery","ice_cream_shop","donut_shop","deli","meal_takeaway","food_court","juice_shop","bagel_shop","dessert_shop","cafeteria","snack_bar","tea_house","acai_shop","confectionery"];

  function styleOf(p) {
    if (p._style) return p._style;
    const n = norm(p.name);
    const types = [p.primaryType, ...(p.types || [])].filter(Boolean);
    let s;
    if (DRIVE_CHAINS.some((c) => n.includes(c))) s = "drive";
    else if (QUICK_CHAINS.some((c) => n.includes(c))) s = "quick";
    else if (types.some((t) => QUICK_TYPES.includes(t))) s = "quick";
    else s = "sit";
    return (p._style = s);
  }
  const stopMins = (p) => STYLES[styleOf(p)].mins;
  const kind = (p) => {
    const t = String(p.type || "").replace(/ restaurant$/i, "");
    return t && !/^restaurant$/i.test(t) ? t : "";
  };

  const SORTS = [["detour", "Least detour"], ["total", "Least total time"], ["soonest", "Coming up first"]];
  const FAR_MIN = 20; // detours longer than this are tucked away

  const state = {
    here: null, data: null, demo: false, sel: null, sheet: "half",
    style: "all", sort: "detour", showFar: false,
  };
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem("pitstop." + k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem("pitstop." + k, JSON.stringify(v)); } catch {} },
  };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtDur = (secs) => { const m = Math.round(secs / 60); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} hr ${m % 60} min`; };
  const detourMin = (p) => Math.round(p.detourSecs / 60);
  const tier = (m) => (m <= 5 ? "good" : m <= 12 ? "ok" : "bad");
  const shorten = (s) => (String(s).split(",")[0] || s).trim();

  function decodePolyline(str) {
    const pts = []; let i = 0, lat = 0, lng = 0;
    while (i < str.length) {
      for (const which of [0, 1]) {
        let shift = 0, result = 0, b;
        do { b = str.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        const d = result & 1 ? ~(result >> 1) : result >> 1;
        if (which === 0) lat += d; else lng += d;
      }
      pts.push([lat / 1e5, lng / 1e5]);
    }
    return pts;
  }

  // ================= MAP =================
  const hasL = !!window.L;
  let map, tiles = [], routeLayer, pinLayer, meLayer, pins = {};
  const dark = window.matchMedia("(prefers-color-scheme: dark)");
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function setTiles() {
    tiles.forEach((t) => map.removeLayer(t)); tiles = [];
    const esri = "https://server.arcgisonline.com/ArcGIS/rest/services/";
    if (dark.matches) {
      tiles.push(L.tileLayer(esri + "Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 16, maxZoom: 19, attribution: "Tiles &copy; Esri" }));
      tiles.push(L.tileLayer(esri + "Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 16, maxZoom: 19 }));
    } else {
      tiles.push(L.tileLayer(esri + "World_Street_Map/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 18, maxZoom: 19, attribution: "Tiles &copy; Esri" }));
    }
    tiles.forEach((t) => t.addTo(map).bringToBack());
  }
  if (hasL) {
    map = L.map("map", { zoomControl: false, attributionControl: true }).setView([39.5, -96], 4);
    map.attributionControl.setPrefix(false);
    setTiles();
    dark.addEventListener?.("change", () => { setTiles(); if (state.data) { drawRoute(); renderResults(); } });
    routeLayer = L.layerGroup().addTo(map);
    pinLayer = L.layerGroup().addTo(map);
    meLayer = L.layerGroup().addTo(map);
  }
  const divIcon = (html) => L.divIcon({ className: "pin-wrap", html, iconSize: [0, 0], iconAnchor: [0, 0] });
  const visibleInsets = () => ({ top: topcard.getBoundingClientRect().bottom, bottom: sheet.offsetHeight });

  function routePoints() {
    const r = state.data?.route; if (!r) return [];
    return r.points || (r.polyline ? decodePolyline(r.polyline) : []);
  }
  function fitRoute(animate = true) {
    if (!hasL || !state.data) return;
    const pts = routePoints(); if (!pts.length) return;
    const { top, bottom } = visibleInsets();
    map.fitBounds(L.latLngBounds(pts), { paddingTopLeft: [28, top + 28], paddingBottomRight: [28, bottom + 28], animate, maxZoom: 14 });
  }
  function panToVisible(latlng, zoom) {
    if (!hasL) return;
    const { top, bottom } = visibleInsets();
    const z = zoom ?? map.getZoom();
    const offsetY = window.innerHeight / 2 - (top + (window.innerHeight - top - bottom) / 2);
    map.flyTo(map.unproject(map.project(latlng, z).add([0, offsetY]), z), z, { duration: 0.6 });
  }
  function drawRoute() {
    if (!hasL) return;
    routeLayer.clearLayers();
    const r = state.data.route, pts = routePoints();
    L.polyline(pts, { color: cssVar("--route-casing"), weight: 9, opacity: .9, interactive: false }).addTo(routeLayer);
    L.polyline(pts, { color: cssVar("--route"), weight: 6, interactive: false }).addTo(routeLayer);
    if (!state.here) L.marker([r.start.lat, r.start.lng], { icon: divIcon(`<div class="start-dot"></div>`), interactive: false }).addTo(routeLayer);
    L.marker([r.end.lat, r.end.lng], {
      icon: divIcon(`<svg class="end-pin" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z" fill="#d93025" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="9" r="2.6" fill="#fff"/></svg>`),
      interactive: false, zIndexOffset: 500,
    }).addTo(routeLayer);
  }
  function drawPins(places) {
    if (!hasL) return;
    pinLayer.clearLayers(); pins = {};
    places.forEach((p) => {
      const m = detourMin(p);
      const mk = L.marker([p.lat, p.lng], { icon: divIcon(`<div class="pin p-${tier(m)}${p.id === state.sel ? " sel" : ""}">+${m}</div>`), zIndexOffset: 1000 - m }).addTo(pinLayer);
      mk.on("click", () => select(p.id, { fromMap: true }));
      pins[p.id] = mk;
    });
  }
  function showMe(c) {
    if (!hasL) return;
    meLayer.clearLayers();
    L.marker([c.lat, c.lng], { icon: divIcon(`<div class="me-dot"></div>`), interactive: false, zIndexOffset: 2000 }).addTo(meLayer);
  }

  // ================= SHEET =================
  function snaps() {
    const vh = window.innerHeight;
    const pad = parseFloat(getComputedStyle(sheet).paddingBottom) || 0;
    const peek = Math.round(sheetTop.offsetHeight + pad);
    const full = Math.round(vh - topcard.getBoundingClientRect().bottom - 10);
    const half = Math.min(full, Math.max(peek + 150, Math.round(vh * 0.5)));
    return { peek, half, full };
  }
  function applyHeight(h) { sheet.style.height = h + "px"; document.documentElement.style.setProperty("--sheet-vis", h + "px"); }
  function setSheet(name) { state.sheet = name; applyHeight(snaps()[name]); $("fit").classList.toggle("away", name === "full"); }

  let drag = null;
  const nearest = (s, h) => Object.entries(s).sort((a, b) => Math.abs(a[1] - h) - Math.abs(b[1] - h))[0][0];
  sheetTop.addEventListener("pointerdown", (e) => {
    if (e.target.closest("input, button:not(#grab), a")) return;
    drag = { y: e.clientY, h: sheet.offsetHeight, t: performance.now(), moved: false };
    sheet.classList.add("dragging");
    sheetTop.setPointerCapture(e.pointerId);
  });
  sheetTop.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dy = e.clientY - drag.y;
    if (Math.abs(dy) > 4) drag.moved = true;
    const s = snaps();
    applyHeight(Math.max(s.peek, Math.min(s.full, drag.h - dy)));
  });
  const endDrag = (e) => {
    if (!drag) return;
    sheet.classList.remove("dragging");
    const s = snaps(), h = sheet.offsetHeight, order = ["peek", "half", "full"];
    const v = (e.clientY - drag.y) / Math.max(1, performance.now() - drag.t);
    let target;
    if (!drag.moved) target = state.sheet === "half" ? "full" : "half";
    else if (Math.abs(v) > 0.45) {
      const i = order.indexOf(nearest(s, h)), cur = order.indexOf(state.sheet);
      target = v < 0 ? order[Math.min(2, Math.max(i, cur + 1))] : order[Math.max(0, Math.min(i, cur - 1))];
    } else target = nearest(s, h);
    drag = null;
    setSheet(target);
  };
  sheetTop.addEventListener("pointerup", endDrag);
  sheetTop.addEventListener("pointercancel", endDrag);
  window.addEventListener("resize", () => setSheet(state.sheet));

  // ================= INPUTS =================
  const SEG = [["all", "All"], ["drive", "Drive-thru"], ["quick", "Counter"], ["sit", "Sit-down"]];
  function renderSeg() {
    $("seg").innerHTML = SEG.map(([k, l]) => `<button type="button" data-k="${k}" class="${state.style === k ? "on" : ""}">${l}</button>`).join("");
  }
  $("seg").addEventListener("click", (e) => {
    const b = e.target.closest("[data-k]"); if (!b) return;
    state.style = b.dataset.k; store.set("style", state.style);
    renderSeg();
    if (state.data) rerender();
  });
  const syncQ = () => { $("clearQ").hidden = !queryEl.value.trim(); };
  queryEl.addEventListener("input", syncQ);
  $("clearQ").addEventListener("click", () => { queryEl.value = ""; syncQ(); queryEl.focus(); });
  $("find").addEventListener("click", search);

  function setHere(on, coords) {
    state.here = on ? coords : null;
    $("locate").classList.toggle("on", on);
    if (on) { fromEl.value = "My location"; showMe(coords); } else if (hasL) meLayer.clearLayers();
  }
  $("locate").addEventListener("click", () => {
    if (state.here) { setHere(false); fromEl.value = ""; fromEl.focus(); return; }
    if (!navigator.geolocation) return showError("Location isn't available in this browser.");
    fromEl.value = "Finding you…";
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const c = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        setHere(true, c);
        if (toEl.value.trim()) search();
        else { if (hasL && !state.data) panToVisible([c.lat, c.lng], 12); toEl.focus(); }
      },
      () => { fromEl.value = ""; showError("Couldn't get your location. Check Settings → Privacy → Location Services → Safari."); },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
    );
  });
  fromEl.addEventListener("input", () => { if (state.here) setHere(false); });
  fromEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); toEl.focus(); } });
  toEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); search(); } });
  queryEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); search(); } });
  $("fit").addEventListener("click", () => fitRoute());
  $("swap").addEventListener("click", () => {
    const a = state.here ? "" : fromEl.value;
    fromEl.value = toEl.value; toEl.value = a;
    if (state.here) setHere(false);
  });

  // ================= SEARCH =================
  // A blank search covers everything: sit-down, fast food and drive-thrus
  const searchTerms = () => queryEl.value.trim() ? [queryEl.value.trim()] : ["restaurants", "fast food", "drive thru"];

  async function search() {
    const origin = state.here || fromEl.value.trim();
    const destination = toEl.value.trim();
    if (!origin) return fromEl.focus();
    if (!destination) return toEl.focus();
    document.activeElement?.blur();
    store.set("last", { from: state.here ? "" : fromEl.value.trim(), to: destination, query: queryEl.value.trim() });

    state.sel = null; state.showFar = false;
    bodyEl.innerHTML = `<div class="loadbar"></div>` + '<div class="skel"><div class="a"></div><div><div class="b"></div><div class="c"></div></div></div>'.repeat(4);
    if (state.sheet === "peek") setSheet("half");
    $("find").disabled = true; $("findLabel").textContent = "Searching…";

    try {
      const res = await fetch("/api/pitstop", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ origin, destination, queries: searchTerms() }),
      });
      const data = await res.json().catch(() => ({ error: "The server sent back something unexpected." }));
      if (!res.ok || data.error) throw new Error(data.error || `Request failed (${res.status})`);
      state.data = data; state.demo = false;
      showResults();
    } catch (err) {
      showError(err.message === "Failed to fetch" ? "Couldn't reach the server. Are you online?" : err.message, true);
    } finally {
      $("find").disabled = false; $("findLabel").textContent = "Find food stops";
    }
  }

  function showResults() {
    $("fit").hidden = false;
    setSheet(state.sheet === "full" ? "full" : "half");
    drawRoute(); renderResults(); fitRoute(false);
  }

  const totalSecs = (p) => p.detourSecs + stopMins(p) * 60;
  function sorted(list) {
    return list.sort((a, b) =>
      state.sort === "detour" ? a.detourSecs - b.detourSecs || a.reachSecs - b.reachSecs :
      state.sort === "total" ? totalSecs(a) - totalSecs(b) || a.reachSecs - b.reachSecs :
      a.reachSecs - b.reachSecs);
  }

  function renderResults() {
    const d = state.data;
    const ofStyle = (d.places || []).filter((p) => state.style === "all" || styleOf(p) === state.style);
    const near = ofStyle.filter((p) => detourMin(p) <= FAR_MIN);
    const far = ofStyle.length - near.length;
    const list = sorted(state.showFar ? ofStyle.slice() : near);
    const toLabel = state.demo ? "Grand Rapids" : shorten(toEl.value);
    const what = queryEl.value.trim();
    const styleWord = state.style === "all" ? "" : SEG.find(([k]) => k === state.style)[1].toLowerCase() + " ";
    const sortLabel = SORTS.find(([v]) => v === state.sort)[1];

    bodyEl.innerHTML = `
      <div class="results-head">
        <div class="summary">
          <div class="sum-text">
            <div class="sum-main">${state.demo ? `<span class="demo-tag">DEMO</span>` : ""}${list.length} ${esc(styleWord)}${what ? esc(what) + " " : ""}stop${list.length === 1 ? "" : "s"}</div>
            <div class="sum-side">${fmtDur(d.route.durationSecs)} drive to ${esc(toLabel)}</div>
          </div>
          <label class="sort"><span>${sortLabel}</span>
            <select id="sortSel" aria-label="Sort">${SORTS.map(([v, l]) => `<option value="${v}"${v === state.sort ? " selected" : ""}>${l}</option>`).join("")}</select>
          </label>
        </div>
      </div>
      ${list.length ? `<ul class="list" id="list">${list.map(row).join("")}</ul>` : emptyNote(ofStyle.length, d.places?.length || 0)}
      ${far && !state.showFar ? `<button class="pill more-far" id="showFar">Show ${far} more (over ${FAR_MIN} min detour)</button>` : ""}
      ${list.length ? `<div class="foot">Time at stop is an estimate: drive-thru ~${STYLES.drive.mins} min, counter ~${STYLES.quick.mins}, sit-down ~${STYLES.sit.mins}.</div>` : ""}`;

    $("sortSel").onchange = (e) => { state.sort = e.target.value; store.set("sort", state.sort); rerender(); };
    $("showFar")?.addEventListener("click", () => { state.showFar = true; rerender(); });
    $("list")?.addEventListener("click", (e) => {
      if (e.target.closest("a")) return;
      const r = e.target.closest(".row"); if (r) select(r.dataset.id === state.sel ? null : r.dataset.id);
    });
    bodyEl.querySelector("[data-all]")?.addEventListener("click", () => { state.style = "all"; renderSeg(); rerender(); });
    drawPins(list);
  }
  const rerender = () => { const keep = bodyEl.scrollTop; renderResults(); bodyEl.scrollTop = keep; };

  function emptyNote(styleCount, total) {
    if (!total) return `<div class="state"><strong>Nothing found along this route</strong>Try a different search.</div>`;
    if (!styleCount) return `<div class="state"><strong>No ${SEG.find(([k]) => k === state.style)[1].toLowerCase()} spots found</strong>${total} other stop${total === 1 ? "" : "s"} along the way.<br><button class="pill" data-all>Show all</button></div>`;
    return `<div class="state"><strong>Nothing within ${FAR_MIN} min of your route</strong></div>`;
  }

  function row(p) {
    const m = detourMin(p), t = tier(m), st = styleOf(p), sm = stopMins(p);
    const off = p.offRouteMiles < 0.15 ? "on route" : `${p.offRouteMiles.toFixed(1)} mi off`;
    const k = kind(p);
    const line1 = [`<span class="style-tag">${STYLES[st].short}</span>`, k ? esc(k) : "", p.rating ? `★ ${p.rating.toFixed(1)}` : "", p.openNow === false ? `<span class="closed">Closed</span>` : ""].filter(Boolean).join(" · ");
    const line2 = `${fmtDur(p.reachSecs)} ahead · <span class="${p.offRouteMiles > 3 ? "warn" : ""}">${off}</span>`;
    return `
      <li class="row${p.id === state.sel ? " sel" : ""}" data-id="${esc(p.id)}">
        <div class="row-main">
          <div class="figs">
            <div class="detour t-${t}"><b>+${m}</b><span>drive</span></div>
            <div class="stopfig" title="Estimated time at the stop">
~${sm} stop
            </div>
          </div>
          <div class="row-text">
            <div class="name">${esc(p.name)}</div>
            <div class="meta">${line1}</div>
            <div class="meta">${line2}</div>
          </div>
          <a class="navbtn" href="${esc(navLink(p))}" target="_blank" rel="noopener" aria-label="Directions with this stop">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21.7 11.3 12.7 2.3a1 1 0 0 0-1.4 0l-9 9a1 1 0 0 0 0 1.4l9 9a1 1 0 0 0 1.4 0l9-9a1 1 0 0 0 0-1.4zM14 14.5V12h-4v3H8v-4a1 1 0 0 1 1-1h5V7.5l3.5 3.5-3.5 3.5z"/></svg>
          </a>
        </div>
        <div class="row-more">
          <div class="breakdown">
            <div>Detour<b>+${m} min</b></div>
            <div>At stop<b>~${sm} min</b></div>
            <div>Total<b>+${m + sm} min</b></div>
          </div>
          <div class="addr">${esc(p.address)}${p.ratingCount ? ` · ${p.ratingCount.toLocaleString()} reviews` : ""}</div>
          <div class="more-actions">
            <a class="pill solid" href="${esc(navLink(p))}" target="_blank" rel="noopener">Add stop</a>
            <a class="pill" href="${esc(reviewsLink(p))}" target="_blank" rel="noopener">Reviews</a>
          </div>
        </div>
      </li>`;
  }

  function select(id, { fromMap = false } = {}) {
    state.sel = id;
    document.querySelectorAll(".row").forEach((r) => r.classList.toggle("sel", r.dataset.id === id));
    Object.entries(pins).forEach(([pid, mk]) => mk.getElement()?.querySelector(".pin")?.classList.toggle("sel", pid === id));
    if (!id) return;
    const p = state.data.places.find((x) => x.id === id);
    const wasFull = state.sheet === "full";
    if (fromMap || state.sheet === "peek") setSheet("half");
    if (wasFull) setSheet("half");
    setTimeout(() => document.querySelector(`.row[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({ behavior: "smooth", block: "nearest" }), 320);
    if (p && hasL) setTimeout(() => panToVisible([p.lat, p.lng], Math.max(map.getZoom(), 13)), wasFull ? 300 : 0);
  }

  function showError(msg, offerDemo = false) {
    bodyEl.innerHTML = `<div class="err"><strong>Hit a snag</strong>${esc(msg)}
      ${offerDemo ? `<div><button class="pill" id="demoBtn">Show demo results</button></div>` : ""}</div>`;
    if (state.sheet === "peek") setSheet("half");
    $("demoBtn")?.addEventListener("click", showDemo);
  }

  function showIntro() {
    bodyEl.innerHTML = `
      <div class="intro">
        <h1>Food on the way</h1>
        <p>Set your route and search, or leave the search blank to see everything. Each stop shows the drive time it adds, plus about how long you'll spend there.</p>
        <button class="linkbtn" id="demoBtn">See a demo →</button>
      </div>`;
    $("demoBtn").onclick = showDemo;
  }

  function reviewsLink(p) {
    if (p.mapsUri) return p.mapsUri;
    const u = new URL("https://www.google.com/maps/search/");
    u.searchParams.set("api", "1");
    u.searchParams.set("query", `${p.name}, ${p.address}`);
    if (!state.demo) u.searchParams.set("query_place_id", p.id);
    return u.toString();
  }
  function navLink(p) {
    const u = new URL("https://www.google.com/maps/dir/");
    u.searchParams.set("api", "1");
    if (state.demo) u.searchParams.set("origin", "Detroit, MI");
    else if (!state.here) u.searchParams.set("origin", fromEl.value.trim());
    u.searchParams.set("destination", state.demo ? "Grand Rapids, MI" : toEl.value.trim());
    u.searchParams.set("waypoints", `${p.name}, ${p.address}`);
    if (!state.demo) u.searchParams.set("waypoint_place_ids", p.id);
    u.searchParams.set("travelmode", "driving");
    return u.toString();
  }

  // ================= DEMO =================
  function showDemo() {
    const route = [[42.3314,-83.0458],[42.36,-83.12],[42.40,-83.20],[42.44,-83.33],[42.4806,-83.4755],[42.51,-83.62],[42.5295,-83.7802],[42.57,-83.95],[42.62,-84.10],[42.68,-84.35],[42.7325,-84.5555],[42.80,-84.73],[42.8692,-84.9030],[42.90,-85.10],[42.93,-85.30],[42.95,-85.50],[42.9634,-85.6681]];
    const P = (id, name, type, primaryType, address, lat, lng, reachMin, reachMi, dm, off, rating, count, open) =>
      ({ id, name, type, primaryType, types: [primaryType], address, lat, lng, reachSecs: reachMin * 60, reachMiles: reachMi, detourSecs: dm * 60, offRouteMiles: off, rating, ratingCount: count, openNow: open });
    state.data = {
      route: { durationSecs: 151 * 60, miles: 158, start: { lat: 42.3314, lng: -83.0458 }, end: { lat: 42.9634, lng: -85.6681 }, points: route },
      places: [
        P("d1", "Taco Bell", "Mexican restaurant", "mexican_restaurant", "I-96 & Novi Rd, Novi, MI", 42.4790, -83.4740, 31, 28, 3, 0.2, 3.9, 1820, true),
        P("d2", "Culver's", "Hamburger restaurant", "hamburger_restaurant", "Grand River Ave, Brighton, MI", 42.5360, -83.7700, 47, 46, 4, 0.6, 4.5, 2210, true),
        P("d3", "Panera Bread", "Sandwich shop", "sandwich_shop", "Saginaw Hwy, Lansing, MI", 42.7550, -84.5900, 79, 87, 6, 1.4, 4.2, 980, true),
        P("d4", "Applebee's Grill + Bar", "American restaurant", "american_restaurant", "E Grand River Ave, Howell, MI", 42.6080, -83.9300, 58, 58, 7, 1.1, 4.0, 1702, true),
        P("d5", "Big Boy", "Family restaurant", "family_restaurant", "Grand River Ave, Portland, MI", 42.8730, -84.9050, 98, 112, 4, 0.3, 4.1, 1388, true),
        P("d6", "Biggby Coffee", "Coffee shop", "coffee_shop", "E Saginaw St, Lansing, MI", 42.7400, -84.5200, 76, 84, 9, 2.2, 4.6, 412, true),
        P("d7", "Chipotle Mexican Grill", "Mexican restaurant", "mexican_restaurant", "28th St SE, Grand Rapids, MI", 42.9130, -85.5900, 140, 150, 9, 3.2, 3.8, 2240, true),
        P("d8", "Texas Roadhouse", "Steak house", "steak_house", "Lansing Rd, Lansing, MI", 42.7000, -84.6300, 81, 90, 17, 4.1, 4.4, 5100, false),
      ],
    };
    state.demo = true; state.sel = null;
    showResults();
  }

  // ================= START =================
  const last = store.get("last");
  if (last) { fromEl.value = last.from || ""; toEl.value = last.to || ""; queryEl.value = last.query || ""; }
  const savedSort = store.get("sort"); if (savedSort) state.sort = savedSort;
  const savedStyle = store.get("style"); if (SEG.some(([k]) => k === savedStyle)) state.style = savedStyle;
  renderSeg(); syncQ(); showIntro(); setSheet("half");
  if (new URLSearchParams(location.search).has("demo")) showDemo();
})();
</script>
</body>
</html>
