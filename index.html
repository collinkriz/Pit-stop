<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pit Stop">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<title>Pit Stop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #ffffff;
    --sheet: #ffffff;
    --field: #f1f3f4;
    --line: #e3e5e8;
    --text: #1f1f1f;
    --muted: #5f6368;
    --faint: #9aa0a6;
    --blue: #1a73e8;
    --blue-soft: #e8f0fe;
    --route: #1a73e8;
    --route-casing: #0b4fb5;
    --good: #188038; --good-bg: #e6f4ea; --good-pin: #1e8e3e;
    --ok: #b06000;   --ok-bg: #fef3e0;   --ok-pin: #e37400;
    --bad: #c5221f;  --bad-bg: #fce8e6;  --bad-pin: #d93025;
    --shadow: 0 2px 6px rgba(60,64,67,.15), 0 1px 2px rgba(60,64,67,.3);
    --shadow-lg: 0 -2px 16px rgba(60,64,67,.18);
    --sheet-vis: 50vh;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --sheet: #1c1c1e; --field: #2c2c2e; --line: #38383a;
      --text: #f2f2f7; --muted: #aeaeb2; --faint: #8e8e93;
      --blue: #4c8dff; --blue-soft: #1f2f4d; --route: #4c8dff; --route-casing: #1d4fa8;
      --good: #81c995; --good-bg: #1f3326; --good-pin: #2e9a4f;
      --ok: #fdc36b;   --ok-bg: #3b2e17;   --ok-pin: #e8890c;
      --bad: #f28b82;  --bad-bg: #3c1f1e;  --bad-pin: #e0473c;
      --shadow: 0 2px 8px rgba(0,0,0,.5);
      --shadow-lg: 0 -2px 18px rgba(0,0,0,.55);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); }
  button, input { font-family: inherit; }

  /* Map */
  #map { position: fixed; inset: 0; z-index: 0; background: var(--field); }
  .leaflet-container { font-family: var(--font); }
  .leaflet-bottom { bottom: var(--sheet-vis); transition: bottom .28s ease; }
  .leaflet-control-attribution { font-size: 10px; background: rgba(255,255,255,.7) !important; }
  @media (prefers-color-scheme: dark) { .leaflet-control-attribution { background: rgba(0,0,0,.55) !important; color: #aaa; } .leaflet-control-attribution a { color: #ccc; } }

  /* Top route card */
  .topcard {
    position: fixed; z-index: 1100; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 8px);
    max-width: 560px; margin: 0 auto;
    background: var(--sheet); border-radius: 14px; box-shadow: var(--shadow);
    display: flex; align-items: stretch; padding: 6px 6px 6px 14px; gap: 10px;
  }
  .rail { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px 0; }
  .rail .s { width: 11px; height: 11px; border-radius: 50%; border: 2.5px solid var(--blue); background: var(--sheet); flex: none; }
  .rail .l { flex: 1; width: 0; border-left: 2px dotted var(--faint); margin: 4px 0; min-height: 14px; }
  .rail .e { width: 12px; height: 12px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--bad-pin); flex: none; }
  .inputs { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .in-row { display: flex; align-items: center; }
  .in-row input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text);
    font-size: 16px; padding: 11px 0;
  }
  .in-row input::placeholder { color: var(--faint); }
  .inputs .div { height: 1px; background: var(--line); }
  .ibtn {
    width: 40px; height: 40px; border: 0; background: none; color: var(--muted); border-radius: 50%;
    display: grid; place-items: center; cursor: pointer; flex: none;
  }
  .ibtn:active { background: var(--field); }
  .ibtn.on { color: var(--blue); }
  .swap { align-self: center; }

  /* Floating button */
  .fab {
    position: fixed; z-index: 1050; right: 12px; bottom: calc(var(--sheet-vis) + 12px);
    width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--sheet); color: var(--blue);
    box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer;
    transition: bottom .28s ease, opacity .2s;
  }
  .fab[hidden] { display: none; }
  .fab.away { opacity: 0; pointer-events: none; }

  /* Bottom sheet */
  .sheet {
    position: fixed; z-index: 1100; left: 0; right: 0; bottom: 0; height: 50vh;
    max-width: 640px; margin: 0 auto;
    background: var(--sheet); border-radius: 16px 16px 0 0; box-shadow: var(--shadow-lg);
    display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom);
    transition: height .28s cubic-bezier(.2,.8,.2,1);
  }
  .sheet.dragging { transition: none; }
  .sheet-top { touch-action: none; flex: none; padding: 0 16px 10px; }
  .grab { padding: 8px 0 10px; display: grid; place-items: center; cursor: grab; }
  .grab i { width: 38px; height: 5px; border-radius: 3px; background: var(--line); display: block; }
  .search-row { display: flex; gap: 8px; align-items: center; }
  .search {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--field);
    border-radius: 12px; padding: 0 4px 0 12px; color: var(--muted);
  }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); font-size: 16px; padding: 11px 0; }
  .search input::placeholder { color: var(--faint); }
  .search .ibtn { width: 32px; height: 32px; }
  .search .ibtn[hidden] { display: none; }
  .gobtn {
    flex: none; border: 0; border-radius: 12px; background: var(--blue); color: #fff; font-weight: 600; font-size: 16px;
    height: 44px; padding: 0 16px; cursor: pointer;
  }
  .gobtn:disabled { opacity: .55; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 10px -16px 0; padding: 0 16px 2px; touch-action: pan-x; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--line); background: var(--sheet); color: var(--text);
    font-size: 14px; font-weight: 500; padding: 7px 13px; border-radius: 999px; cursor: pointer;
  }
  .chip.on { background: var(--blue-soft); border-color: transparent; color: var(--blue); }

  .sheet-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; border-top: 1px solid var(--line); }

  /* Intro */
  .intro { padding: 22px 20px 28px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--blue); display: grid; place-items: center; flex: none; }
  .intro h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.3px; }
  .intro p { color: var(--muted); font-size: 15px; line-height: 1.45; margin: 12px 0 0; }
  .how { margin: 18px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; }
  .how li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; font-size: 14px; color: var(--muted); line-height: 1.4; }
  .how b { color: var(--text); font-weight: 600; }
  .how .n { width: 24px; height: 24px; border-radius: 50%; background: var(--blue-soft); color: var(--blue); font-size: 13px; font-weight: 700; display: grid; place-items: center; }
  .linkbtn { border: 0; background: none; color: var(--blue); font-size: 15px; font-weight: 600; padding: 0; margin-top: 18px; cursor: pointer; }

  /* Results */
  .summary { padding: 14px 16px 4px; }
  .sum-main { font-size: 20px; font-weight: 700; letter-spacing: -.2px; }
  .sum-main span { color: var(--muted); font-weight: 500; }
  .sum-sub { color: var(--muted); font-size: 14px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .demo-tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .5px; color: var(--ok); background: var(--ok-bg); padding: 2px 7px; border-radius: 5px; margin-bottom: 6px; }
  .filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 10px 16px; align-items: center; }
  .filters::-webkit-scrollbar { display: none; }
  .filters .sep { width: 1px; height: 22px; background: var(--line); flex: none; margin: 0 4px; }
  .list { list-style: none; margin: 0; padding: 0 0 24px; }
  .row { border-top: 1px solid var(--line); padding: 12px 16px; cursor: pointer; }
  .row:first-child { border-top: 0; }
  .row.sel { background: var(--blue-soft); }
  .row-main { display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: center; }
  .detour { border-radius: 10px; text-align: center; padding: 6px 0 5px; line-height: 1; }
  .detour b { display: block; font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
  .detour span { font-size: 11px; font-weight: 600; }
  .t-good { color: var(--good); background: var(--good-bg); }
  .t-ok { color: var(--ok); background: var(--ok-bg); }
  .t-bad { color: var(--bad); background: var(--bad-bg); }
  .row-text { min-width: 0; }
  .name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: 13.5px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
  .meta .warn { color: var(--ok); font-weight: 500; }
  .meta .open { color: var(--good); font-weight: 500; }
  .meta .closed { color: var(--bad); font-weight: 500; }
  .navbtn {
    width: 44px; height: 44px; border-radius: 50%; background: var(--blue); color: #fff;
    display: grid; place-items: center; text-decoration: none; flex: none;
  }
  .row-more { display: none; margin: 10px 0 0 70px; }
  .row.sel .row-more { display: block; }
  .addr { font-size: 13.5px; color: var(--muted); line-height: 1.35; }
  .more-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none; cursor: pointer;
    border: 1px solid var(--line); background: var(--sheet); color: var(--blue);
    font-size: 14px; font-weight: 600; padding: 7px 12px; border-radius: 999px; white-space: nowrap; flex: none;
  }
  .pill.on { background: var(--blue-soft); border-color: transparent; }
  .pill.solid { background: var(--blue); color: #fff; border-color: var(--blue); }

  .state { padding: 30px 20px; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .state strong { color: var(--text); display: block; font-size: 16px; margin-bottom: 2px; }
  .err { margin: 16px; padding: 14px; border-radius: 12px; background: var(--bad-bg); color: var(--bad); font-size: 14px; line-height: 1.45; }
  .err strong { display: block; margin-bottom: 2px; }
  .err .pill { margin-top: 10px; }

  /* Loading */
  .loadbar { height: 3px; overflow: hidden; position: relative; background: var(--blue-soft); }
  .loadbar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; background: var(--blue); animation: lb 1.1s ease-in-out infinite; }
  @keyframes lb { from { left: -40%; } to { left: 100%; } }
  .skel { padding: 14px 16px; display: grid; grid-template-columns: 58px 1fr; gap: 12px; border-top: 1px solid var(--line); }
  .skel div { border-radius: 8px; background: var(--field); }
  .skel .a { height: 46px; } .skel .b { height: 14px; margin-top: 6px; width: 60%; } .skel .c { height: 12px; margin-top: 8px; width: 85%; }

  /* Map pins */
  .pin-wrap { background: none; border: 0; }
  .pin {
    position: absolute; transform: translate(-50%, calc(-100% - 6px)); white-space: nowrap;
    color: #fff; font: 700 13px var(--font); padding: 4px 8px; border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.35); border: 1.5px solid #fff; transition: transform .15s;
  }
  .pin::after {
    content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%);
    border: 6px solid transparent; border-bottom: 0; border-top-color: inherit;
  }
  .pin.p-good { background: var(--good-pin); border-top-color: var(--good-pin); }
  .pin.p-ok { background: var(--ok-pin); border-top-color: var(--ok-pin); }
  .pin.p-bad { background: var(--bad-pin); border-top-color: var(--bad-pin); }
  .pin.p-good::after { border-top-color: var(--good-pin); }
  .pin.p-ok::after { border-top-color: var(--ok-pin); }
  .pin.p-bad::after { border-top-color: var(--bad-pin); }
  .pin.sel { transform: translate(-50%, calc(-100% - 6px)) scale(1.25); z-index: 10; outline: 3px solid rgba(26,115,232,.35); }
  .end-pin { position: absolute; width: 22px; height: 22px; transform: translate(-50%, -100%); }
  .me-dot { position: absolute; width: 18px; height: 18px; transform: translate(-50%, -50%); border-radius: 50%; background: var(--blue); border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(26,115,232,.2), 0 1px 3px rgba(0,0,0,.3); }
</style>
</head>
<body>

<div id="map"></div>

<div class="topcard" id="topcard">
  <div class="rail" aria-hidden="true"><span class="s"></span><span class="l"></span><span class="e"></span></div>
  <div class="inputs">
    <div class="in-row">
      <input id="from" placeholder="Starting point" enterkeyhint="next" autocomplete="off">
      <button type="button" class="ibtn" id="locate" aria-label="Start from my location">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21 3 3 10.5l7.2 2.3L12.5 20z"/></svg>
      </button>
    </div>
    <div class="div"></div>
    <div class="in-row">
      <input id="to" placeholder="Where to?" enterkeyhint="search" autocomplete="off">
    </div>
  </div>
  <button type="button" class="ibtn swap" id="swap" aria-label="Swap start and destination">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 4v16M8 4 4.5 7.5M8 4l3.5 3.5M16 20V4M16 20l-3.5-3.5M16 20l3.5-3.5"/></svg>
  </button>
</div>

<button class="fab" id="fit" hidden aria-label="Show whole route">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>

<section class="sheet" id="sheet">
  <div class="sheet-top" id="sheetTop">
    <div class="grab" id="grab"><i></i></div>
    <div class="search-row">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="query" placeholder="Taco Bell, coffee… or leave blank" enterkeyhint="search" autocomplete="off">
        <button type="button" class="ibtn" id="clearQ" aria-label="Clear" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.3 12.9-1.4 1.4L12 13.4l-2.9 2.9-1.4-1.4 2.9-2.9-2.9-2.9 1.4-1.4 2.9 2.9 2.9-2.9 1.4 1.4-2.9 2.9z"/></svg>
        </button>
      </div>
      <button type="button" class="gobtn" id="go">Search</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="sheet-body" id="body"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const fromEl = $("from"), toEl = $("to"), queryEl = $("query"), bodyEl = $("body");
  const sheet = $("sheet"), sheetTop = $("sheetTop"), topcard = $("topcard");

  const CHIPS = ["All food", "Taco Bell", "McDonald's", "Chick-fil-A", "Culver's", "Wendy's", "Coffee", "Pizza"];
  const MAX_OPTIONS = [["≤ 5 min", 5], ["≤ 10", 10], ["≤ 15", 15], ["Any", Infinity]];

  const state = { here: null, data: null, demo: false, maxDetour: 15, sort: "detour", sel: null, sheet: "half", loading: false };
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem("pitstop." + k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem("pitstop." + k, JSON.stringify(v)); } catch {} },
  };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtDur = (secs) => { const m = Math.round(secs / 60); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} hr ${m % 60} min`; };
  const detourMin = (p) => Math.round(p.detourSecs / 60);
  const tier = (m) => (m <= 5 ? "good" : m <= 12 ? "ok" : "bad");
  const shorten = (s) => (String(s).split(",")[0] || s).trim();

  function decodePolyline(str) {
    const pts = []; let i = 0, lat = 0, lng = 0;
    while (i < str.length) {
      for (const which of [0, 1]) {
        let shift = 0, result = 0, b;
        do { b = str.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        const d = result & 1 ? ~(result >> 1) : result >> 1;
        if (which === 0) lat += d; else lng += d;
      }
      pts.push([lat / 1e5, lng / 1e5]);
    }
    return pts;
  }

  // ================= MAP =================
  const hasL = !!window.L;
  let map, tiles = [], routeLayer, pinLayer, meLayer, pins = {};
  const dark = window.matchMedia("(prefers-color-scheme: dark)");

  function setTiles() {
    tiles.forEach((t) => map.removeLayer(t)); tiles = [];
    const esri = "https://server.arcgisonline.com/ArcGIS/rest/services/";
    if (dark.matches) {
      tiles.push(L.tileLayer(esri + "Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 16, maxZoom: 19, attribution: "Tiles &copy; Esri" }));
      tiles.push(L.tileLayer(esri + "Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 16, maxZoom: 19 }));
    } else {
      tiles.push(L.tileLayer(esri + "World_Street_Map/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 18, maxZoom: 19, attribution: "Tiles &copy; Esri" }));
    }
    tiles.forEach((t) => t.addTo(map).bringToBack());
  }

  if (hasL) {
    map = L.map("map", { zoomControl: false, attributionControl: true, worldCopyJump: true }).setView([39.5, -96], 4);
    map.attributionControl.setPrefix(false);
    setTiles();
    dark.addEventListener?.("change", setTiles);
    routeLayer = L.layerGroup().addTo(map);
    pinLayer = L.layerGroup().addTo(map);
    meLayer = L.layerGroup().addTo(map);
  }

  const divIcon = (html, z) => L.divIcon({ className: "pin-wrap", html, iconSize: [0, 0], iconAnchor: [0, 0] });

  // Visible map area = between the top card and the sheet
  function visibleInsets() {
    const top = topcard.getBoundingClientRect().bottom;
    const bottom = sheet.offsetHeight;
    return { top, bottom };
  }

  function fitRoute(animate = true) {
    if (!hasL || !state.data) return;
    const pts = routePoints();
    if (!pts.length) return;
    const { top, bottom } = visibleInsets();
    map.fitBounds(L.latLngBounds(pts), {
      paddingTopLeft: [28, top + 28], paddingBottomRight: [28, bottom + 28], animate, maxZoom: 14,
    });
  }

  function panToVisible(latlng, zoom) {
    if (!hasL) return;
    const { top, bottom } = visibleInsets();
    const z = zoom ?? map.getZoom();
    const visCenterY = top + (window.innerHeight - top - bottom) / 2;
    const offsetY = window.innerHeight / 2 - visCenterY;
    const pt = map.project(latlng, z).add([0, offsetY]);
    map.flyTo(map.unproject(pt, z), z, { duration: 0.6 });
  }

  function routePoints() {
    const r = state.data?.route; if (!r) return [];
    return r.points || (r.polyline ? decodePolyline(r.polyline) : []);
  }

  function drawRoute() {
    if (!hasL) return;
    routeLayer.clearLayers();
    const r = state.data.route, pts = routePoints();
    const css = getComputedStyle(document.documentElement);
    L.polyline(pts, { color: css.getPropertyValue("--route-casing").trim(), weight: 9, opacity: .9, interactive: false }).addTo(routeLayer);
    L.polyline(pts, { color: css.getPropertyValue("--route").trim(), weight: 6, opacity: 1, interactive: false }).addTo(routeLayer);
    if (!state.here) {
      L.marker([r.start.lat, r.start.lng], { icon: divIcon(`<div class="me-dot" style="background:#fff;border-color:${css.getPropertyValue("--route").trim()};border-width:4px"></div>`), interactive: false }).addTo(routeLayer);
    }
    L.marker([r.end.lat, r.end.lng], {
      icon: divIcon(`<svg class="end-pin" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z" fill="#d93025" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="9" r="2.6" fill="#fff"/></svg>`),
      interactive: false, zIndexOffset: 500,
    }).addTo(routeLayer);
  }

  function drawPins(places) {
    if (!hasL) return;
    pinLayer.clearLayers(); pins = {};
    places.forEach((p) => {
      const m = detourMin(p);
      const mk = L.marker([p.lat, p.lng], {
        icon: divIcon(`<div class="pin p-${tier(m)}${p.id === state.sel ? " sel" : ""}">+${m}</div>`),
        zIndexOffset: 1000 - m,
      }).addTo(pinLayer);
      mk.on("click", () => select(p.id, { fromMap: true }));
      pins[p.id] = mk;
    });
  }

  function showMe(coords) {
    if (!hasL) return;
    meLayer.clearLayers();
    L.marker([coords.lat, coords.lng], { icon: divIcon(`<div class="me-dot"></div>`), interactive: false, zIndexOffset: 2000 }).addTo(meLayer);
  }

  // ================= SHEET =================
  function snaps() {
    const vh = window.innerHeight;
    const pad = parseFloat(getComputedStyle(sheet).paddingBottom) || 0;
    const peek = Math.round(sheetTop.offsetHeight + pad);
    const full = Math.round(vh - topcard.getBoundingClientRect().bottom - 10);
    const half = Math.min(full, Math.max(peek + 140, Math.round(vh * 0.48)));
    return { peek, half, full };
  }
  function applyHeight(h) {
    sheet.style.height = h + "px";
    document.documentElement.style.setProperty("--sheet-vis", h + "px");
  }
  function setSheet(name) {
    state.sheet = name;
    applyHeight(snaps()[name]);
    $("fit").classList.toggle("away", name === "full");
  }

  let drag = null;
  sheetTop.addEventListener("pointerdown", (e) => {
    if (e.target.closest("input, button:not(#grab), a, .chip")) return;
    drag = { y: e.clientY, h: sheet.offsetHeight, t: performance.now(), moved: false };
    sheet.classList.add("dragging");
    sheetTop.setPointerCapture(e.pointerId);
  });
  sheetTop.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dy = e.clientY - drag.y;
    if (Math.abs(dy) > 4) drag.moved = true;
    const s = snaps();
    applyHeight(Math.max(s.peek, Math.min(s.full, drag.h - dy)));
  });
  const endDrag = (e) => {
    if (!drag) return;
    sheet.classList.remove("dragging");
    const s = snaps(), h = sheet.offsetHeight;
    const v = (e.clientY - drag.y) / Math.max(1, performance.now() - drag.t); // px/ms, + = down
    const order = ["peek", "half", "full"];
    let target;
    if (!drag.moved) {
      target = state.sheet === "full" ? "half" : state.sheet === "half" ? "full" : "half";
    } else if (Math.abs(v) > 0.45) {
      const i = order.indexOf(nearest(s, h));
      const cur = order.indexOf(state.sheet);
      target = v < 0 ? order[Math.min(2, Math.max(i, cur + 1))] : order[Math.max(0, Math.min(i, cur - 1))];
    } else {
      target = nearest(s, h);
    }
    drag = null;
    setSheet(target);
  };
  const nearest = (s, h) => Object.entries(s).sort((a, b) => Math.abs(a[1] - h) - Math.abs(b[1] - h))[0][0];
  sheetTop.addEventListener("pointerup", endDrag);
  sheetTop.addEventListener("pointercancel", endDrag);
  window.addEventListener("resize", () => setSheet(state.sheet));

  // ================= INPUTS =================
  function renderChips() {
    const q = queryEl.value.trim().toLowerCase();
    $("chips").innerHTML = CHIPS.map((c) => {
      const on = c === "All food" ? !q : q === c.toLowerCase();
      return `<button type="button" class="chip${on ? " on" : ""}" data-chip="${esc(c)}">${esc(c)}</button>`;
    }).join("");
    $("clearQ").hidden = !q;
  }
  $("chips").addEventListener("click", (e) => {
    const c = e.target.closest("[data-chip]"); if (!c) return;
    queryEl.value = c.dataset.chip === "All food" ? "" : c.dataset.chip;
    renderChips();
    if ((state.here || fromEl.value.trim()) && toEl.value.trim()) search();
  });
  queryEl.addEventListener("input", renderChips);
  $("clearQ").addEventListener("click", () => { queryEl.value = ""; renderChips(); queryEl.focus(); });

  function setHere(on, coords) {
    state.here = on ? coords : null;
    $("locate").classList.toggle("on", on);
    if (on) { fromEl.value = "My location"; showMe(coords); }
    else if (hasL) meLayer.clearLayers();
  }
  $("locate").addEventListener("click", () => {
    if (state.here) { setHere(false); fromEl.value = ""; fromEl.focus(); return; }
    if (!navigator.geolocation) return showError("Location isn't available in this browser.");
    fromEl.value = "Finding you…";
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const c = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        setHere(true, c);
        if (hasL && !state.data) panToVisible([c.lat, c.lng], 12);
        if (!toEl.value.trim()) toEl.focus();
      },
      () => { fromEl.value = ""; showError("Couldn't get your location. Check Settings → Privacy → Location Services → Safari."); },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
    );
  });
  fromEl.addEventListener("input", () => { if (state.here) setHere(false); });
  fromEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); toEl.focus(); } });
  toEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); search(); } });
  queryEl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); search(); } });
  $("go").addEventListener("click", search);
  $("fit").addEventListener("click", () => fitRoute());

  $("swap").addEventListener("click", () => {
    const a = state.here ? "" : fromEl.value;
    fromEl.value = toEl.value; toEl.value = a;
    if (state.here) setHere(false);
  });

  // ================= SEARCH =================
  async function search() {
    const origin = state.here || fromEl.value.trim();
    const destination = toEl.value.trim();
    if (!origin) return fromEl.focus();
    if (!destination) return toEl.focus();
    document.activeElement?.blur();
    store.set("last", { from: state.here ? "" : fromEl.value.trim(), to: destination, query: queryEl.value.trim() });

    $("go").disabled = true;
    state.sel = null;
    bodyEl.innerHTML = `<div class="loadbar"></div>
      <div class="summary"><div class="sum-sub">Checking every stop along your route…</div></div>
      ${'<div class="skel"><div class="a"></div><div><div class="b"></div><div class="c"></div></div></div>'.repeat(4)}`;
    if (state.sheet === "peek") setSheet("half");

    try {
      const res = await fetch("/api/pitstop", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ origin, destination, query: queryEl.value.trim() }),
      });
      const data = await res.json().catch(() => ({ error: "The server sent back something unexpected." }));
      if (!res.ok || data.error) throw new Error(data.error || `Request failed (${res.status})`);
      state.data = data; state.demo = false;
      showResults();
    } catch (err) {
      showError(err.message === "Failed to fetch" ? "Couldn't reach the server. Are you online?" : err.message, true);
    } finally {
      $("go").disabled = false;
    }
  }

  function showResults() {
    $("fit").hidden = false;
    setSheet(state.sheet === "full" ? "full" : "half");
    drawRoute();
    renderResults();
    fitRoute(false);
  }

  function filtered() {
    return (state.data.places || [])
      .filter((p) => detourMin(p) <= state.maxDetour)
      .sort((a, b) => state.sort === "detour"
        ? a.detourSecs - b.detourSecs || a.reachSecs - b.reachSecs
        : a.reachSecs - b.reachSecs);
  }

  function renderResults() {
    const d = state.data, all = d.places || [], list = filtered();
    const fromLabel = state.demo ? "Detroit" : state.here ? "My location" : shorten(fromEl.value);
    const toLabel = state.demo ? "Grand Rapids" : shorten(toEl.value);
    const what = state.demo ? "Taco Bell" : (queryEl.value.trim() || "Food");

    bodyEl.innerHTML = `
      <div class="summary">
        ${state.demo ? `<div class="demo-tag">DEMO DATA</div>` : ""}
        <div class="sum-main">${fmtDur(d.route.durationSecs)} <span>· ${Math.round(d.route.miles)} mi</span></div>
        <div class="sum-sub">${esc(fromLabel)} → ${esc(toLabel)} · ${list.length} ${esc(what)} stop${list.length === 1 ? "" : "s"}</div>
      </div>
      <div class="filters" id="filters">
        <button class="pill${state.sort === "detour" ? " on" : ""}" data-sort="detour">Least detour</button>
        <button class="pill${state.sort === "soonest" ? " on" : ""}" data-sort="soonest">Next up</button>
        <span class="sep"></span>
        ${MAX_OPTIONS.map(([l, v]) => `<button class="pill${v === state.maxDetour ? " on" : ""}" data-max="${v}">${l}</button>`).join("")}
      </div>
      ${list.length ? `<ul class="list" id="list">${list.map(row).join("")}</ul>` : emptyNote(all.length)}`;

    $("filters").onclick = (e) => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.sort) state.sort = b.dataset.sort;
      if (b.dataset.max) { state.maxDetour = b.dataset.max === "Infinity" ? Infinity : Number(b.dataset.max); store.set("maxDetour", b.dataset.max); }
      const keep = bodyEl.scrollTop; renderResults(); bodyEl.scrollTop = keep;
    };
    $("list")?.addEventListener("click", (e) => {
      if (e.target.closest("a")) return;
      const r = e.target.closest(".row"); if (r) select(r.dataset.id === state.sel ? null : r.dataset.id);
    });
    drawPins(list);
  }

  function emptyNote(total) {
    if (!total) return `<div class="state"><strong>Nothing found along this route</strong>Try another search, or "All food".</div>`;
    return `<div class="state"><strong>${total} found, none within ${state.maxDetour} min</strong>Tap "Any" to see them all.</div>`;
  }

  function row(p) {
    const m = detourMin(p), t = tier(m);
    const off = p.offRouteMiles < 0.15 ? "On route" : `${p.offRouteMiles.toFixed(1)} mi off route`;
    const open = p.openNow === true ? `<span class="open">Open</span>` : p.openNow === false ? `<span class="closed">Closed</span>` : "";
    const rating = p.rating ? `★ ${p.rating.toFixed(1)}${p.ratingCount ? ` (${p.ratingCount.toLocaleString()})` : ""}` : "";
    const line2 = [open, rating].filter(Boolean).join(" · ");
    return `
      <li class="row${p.id === state.sel ? " sel" : ""}" data-id="${esc(p.id)}">
        <div class="row-main">
          <div class="detour t-${t}"><b>+${m}</b><span>min</span></div>
          <div class="row-text">
            <div class="name">${esc(p.name)}</div>
            <div class="meta">${fmtDur(p.reachSecs)} ahead · <span class="${p.offRouteMiles > 3 ? "warn" : ""}">${off}</span></div>
            ${line2 ? `<div class="meta">${line2}</div>` : ""}
          </div>
          <a class="navbtn" href="${esc(navLink(p))}" target="_blank" rel="noopener" aria-label="Directions with this stop">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21.7 11.3 12.7 2.3a1 1 0 0 0-1.4 0l-9 9a1 1 0 0 0 0 1.4l9 9a1 1 0 0 0 1.4 0l9-9a1 1 0 0 0 0-1.4zM14 14.5V12h-4v3H8v-4a1 1 0 0 1 1-1h5V7.5l3.5 3.5-3.5 3.5z"/></svg>
          </a>
        </div>
        <div class="row-more">
          <div class="addr">${esc(p.address)} · ${Math.round(p.reachMiles)} mi into trip</div>
          <div class="more-actions">
            <a class="pill solid" href="${esc(navLink(p))}" target="_blank" rel="noopener">Add stop in Google Maps</a>
            <a class="pill" href="${esc(reviewsLink(p))}" target="_blank" rel="noopener">Reviews &amp; photos</a>
          </div>
        </div>
      </li>`;
  }

  function select(id, { fromMap = false } = {}) {
    state.sel = id;
    document.querySelectorAll(".row").forEach((r) => r.classList.toggle("sel", r.dataset.id === id));
    Object.entries(pins).forEach(([pid, mk]) => mk.getElement()?.querySelector(".pin")?.classList.toggle("sel", pid === id));
    if (!id) return;
    const p = state.data.places.find((x) => x.id === id);
    if (fromMap) {
      if (state.sheet === "peek") setSheet("half");
      setTimeout(() => document.querySelector(`.row[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({ behavior: "smooth", block: "nearest" }), 60);
    }
    if (p && hasL) {
      if (state.sheet === "full") setSheet("half");
      setTimeout(() => panToVisible([p.lat, p.lng], Math.max(map.getZoom(), 13)), state.sheet === "full" ? 300 : 0);
    }
  }

  function showError(msg, offerDemo = false) {
    bodyEl.innerHTML = `<div class="err"><strong>Hit a snag</strong>${esc(msg)}
      ${offerDemo ? `<div><button class="pill" id="demoBtn">Show demo results</button></div>` : ""}</div>`;
    if (state.sheet === "peek") setSheet("half");
    $("demoBtn")?.addEventListener("click", showDemo);
  }

  function showIntro() {
    bodyEl.innerHTML = `
      <div class="intro">
        <div class="brand">
          <div class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></div>
          <h1>Pit Stop</h1>
        </div>
        <p>Food along your drive, ranked by how much time it actually adds: off the highway, to the door, and back on.</p>
        <ul class="how">
          <li><span class="n">1</span><span><b>Set your route.</b> Tap the arrow up top to start from where you are.</span></li>
          <li><span class="n">2</span><span><b>Pick a craving.</b> A chain like Taco Bell, or leave it blank for everything.</span></li>
          <li><span class="n">3</span><span><b>Go.</b> Each result shows the minutes it adds. Tap the blue arrow to send it to Google Maps.</span></li>
        </ul>
        <button class="linkbtn" id="demoBtn">See a demo →</button>
      </div>`;
    $("demoBtn").onclick = showDemo;
  }

  // The place's Google page (reviews, photos, hours)
  function reviewsLink(p) {
    if (p.mapsUri) return p.mapsUri;
    const u = new URL("https://www.google.com/maps/search/");
    u.searchParams.set("api", "1");
    u.searchParams.set("query", `${p.name}, ${p.address}`);
    if (!state.demo) u.searchParams.set("query_place_id", p.id);
    return u.toString();
  }

  // Google Maps directions: start → this stop → destination
  function navLink(p) {
    const u = new URL("https://www.google.com/maps/dir/");
    u.searchParams.set("api", "1");
    if (state.demo) u.searchParams.set("origin", "Detroit, MI");
    else if (!state.here) u.searchParams.set("origin", fromEl.value.trim()); // blank = current location
    u.searchParams.set("destination", state.demo ? "Grand Rapids, MI" : toEl.value.trim());
    u.searchParams.set("waypoints", `${p.name}, ${p.address}`);
    if (!state.demo) u.searchParams.set("waypoint_place_ids", p.id);
    u.searchParams.set("travelmode", "driving");
    return u.toString();
  }

  // ================= DEMO =================
  function showDemo() {
    const route = [[42.3314,-83.0458],[42.36,-83.12],[42.40,-83.20],[42.44,-83.33],[42.4806,-83.4755],[42.51,-83.62],[42.5295,-83.7802],[42.57,-83.95],[42.62,-84.10],[42.68,-84.35],[42.7325,-84.5555],[42.80,-84.73],[42.8692,-84.9030],[42.90,-85.10],[42.93,-85.30],[42.95,-85.50],[42.9634,-85.6681]];
    const P = (id, name, address, lat, lng, reachMin, reachMi, dm, off, rating, count, open) =>
      ({ id, name, address, lat, lng, reachSecs: reachMin * 60, reachMiles: reachMi, detourSecs: dm * 60, offRouteMiles: off, rating, ratingCount: count, openNow: open });
    state.data = {
      route: { durationSecs: 151 * 60, miles: 158, start: { lat: 42.3314, lng: -83.0458 }, end: { lat: 42.9634, lng: -85.6681 }, points: route },
      places: [
        P("d1", "Taco Bell", "I-96 & Novi Rd, Novi, MI", 42.4790, -83.4740, 31, 28, 3, 0.2, 3.9, 1820, true),
        P("d2", "Taco Bell", "Grand River Ave, Brighton, MI", 42.5360, -83.7700, 47, 46, 5, 0.6, 4.1, 960, true),
        P("d3", "Taco Bell", "Saginaw Hwy, Lansing, MI", 42.7550, -84.5900, 79, 87, 11, 2.4, 3.7, 1405, true),
        P("d4", "Taco Bell", "E Grand River Ave, Howell, MI", 42.6080, -83.9300, 58, 58, 17, 7.1, 4.0, 702, false),
        P("d5", "Taco Bell", "Grand River Ave, Portland, MI", 42.8730, -84.9050, 98, 112, 4, 0.3, 4.2, 388, true),
        P("d6", "Taco Bell", "28th St SE, Grand Rapids, MI", 42.9130, -85.5900, 140, 150, 9, 3.2, 3.8, 2240, true),
      ],
    };
    state.demo = true; state.sel = null;
    showResults();
  }

  // ================= START =================
  const last = store.get("last");
  if (last) { fromEl.value = last.from || ""; toEl.value = last.to || ""; queryEl.value = last.query || ""; }
  const savedMax = store.get("maxDetour");
  if (savedMax) state.maxDetour = savedMax === "Infinity" ? Infinity : Number(savedMax);
  renderChips();
  showIntro();
  setSheet("half");
  if (!hasL) document.getElementById("map").innerHTML = "";
  if (new URLSearchParams(location.search).has("demo")) showDemo();
})();
</script>
</body>
